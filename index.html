.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn .btn{font-size:16px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);min-width:0}

.chip.sel{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:5}
.nav-in{display:flex;gap:4px;width:100%;max-width:660px}
.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 2px;font:600 14px var(--font-b);color:var(--mute);cursor:pointer;min-height:44px}

.dishes{font-size:17px;font-weight:600}
.table{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
td.r,th.r{text-align:right}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.tabs2{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.bad{color:var(--no);font-weight:700}.good{color:var(--ok);font-weight:700}
.note{background:var(--haldi-soft);border:1px solid var(--haldi);border-radius:10px;padding:10px 12px;font-size:14px}
.empty{text-align:center;padding:22px 12px;color:var(--mute)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90%}
.wk{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.wk b{color:var(--mute);font-weight:600}
@media (prefers-reduced-motion:no-preference){.btn{transition:background .12s}}
</style>

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app'),hd=$('#hd'),nav=$('#nav'),toastEl=$('#toast');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const DOW=['sun','mon','tue','wed','thu','fri','sat'];
const DAYN={sun:'Raviwar',mon:'Somwar',tue:'Mangalwar',wed:'Budhwar',thu:'Guruwar',fri:'Shukrawar',sat:'Shaniwar'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MEALS=[['b','Nashta','8:00 AM','Nashta'],['l','Dopahar ka khana','1:00 PM','Dopahar'],['s','Shaam ka snack','4:30 PM','Snack'],['d','Raat ka khana','8:00 PM','Raat']];
const rupee=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const todayS=()=>iso(new Date());
const fmtDate=s=>{const d=parse(s);return DAYN[DOW[d.getDay()]]+' · '+d.getDate()+' '+MON[d.getMonth()]};
const fmtMonth=m=>{const a=m.split('-');return MON[+a[1]-1]+' '+a[0]};
const num=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const small=u=>u==='kg'?'g':u==='L'?'ml':u;
const toDisp=(q,u)=>(u==='kg'||u==='L')?Math.round(q*10000)/10:q;
const toBase=(q,u)=>(u==='kg'||u==='L')?q/1000:q;
function fmtQty(q,u){const neg=q<0?'-':'';q=Math.abs(q);
  if(u==='kg')return neg+(q<1?Math.round(q*1000)+' g':(+q.toFixed(2))+' kg');
  if(u==='L')return neg+(q<1?Math.round(q*1000)+' ml':(+q.toFixed(2))+' L');
  return neg+(+q.toFixed(1))+' '+u;}

const S={dishes:{},stock:{},menu:{},members:{},att:{},guests:{},purch:{},pay:{},bills:{},exp:{},snap:{},ready:{}};
const UI={tab:'today',date:todayS(),month:todayS().slice(0,7),adm:'menu',edit:null,cf:null,mdate:todayS(),bill:{date:todayS(),note:'',amt:'',for:''},
  xp:{item:'',amt:''},nm:{n:'',p:'',w:''},lg:{p:'',w:'',err:''},pwId:null,pwVal:'',pwP:'',guest:{date:addDays(todayS(),1),n:1,name:'',b:false,l:true,s:false,d:true},
  payAmt:'',shopStart:addDays(todayS(),1),buy:{},mbuy:{item:'',q:'',a:''},sedit:null,dedit:null,newMember:''};
let db=null,user=null,me={id:null,name:''},isAdmin=false,adminOK=false,role=null,canWrite=true,profiles={},reg=true,authBusy=false,tok=null;

function toast(m){toastEl.textContent=m;toastEl.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.hidden=true,2600)}
async function w(fn){try{await fn()}catch(e){toast('Save nahi hua: '+((e&&e.message)||'dobara try karo'))}}

/* ---------- data helpers ---------- */
function members(){return Object.keys(S.members).filter(i=>!S.members[i].off).map(i=>({id:i,...S.members[i]}))
  .sort((a,b)=>nameOf(a.id).localeCompare(nameOf(b.id)))}
function nameOf(id){const m=S.members[id];if(m&&m.name)return m.name;const p=profiles[id];if(p&&p.name)return p.name;
  if(id===me.id&&me.name)return me.name;return 'Member'}
const first=n=>String(n).split(' ')[0];
function menuFor(date){const o=S.menu[date];const t=(S.menu.template||{})[DOW[parse(date).getDay()]]||{};const m=o||t;
  const op=m.opt||{},of=m.off||{};
  return {b:m.b||[],l:m.l||[],s:m.s||[],d:m.d||[],note:m.note||'',
    opt:{b:op.b||[],l:op.l||[],s:op.s||[],d:op.d||[]},off:{b:!!of.b,l:!!of.l,s:!!of.s,d:!!of.d}}}
function dishCost(id){const d=S.dishes[id];if(!d)return 0;let c=num(d.extra);
  (d.ing||[]).forEach(i=>{const s=S.stock[i.s];if(s)c+=num(i.q)*num(s.price)});return c}
const livePlate=(date,k)=>{const m=menuFor(date);return m.off[k]?0:m[k].reduce((a,id)=>a+dishCost(id),0)};
const plate=(date,k)=>{const sn=S.snap[date];if(sn&&date<todayS()&&typeof sn[k]==='number')return sn[k];return livePlate(date,k)};
function autoSnap(){if(!isAdmin||!canWrite||!db||!['dishes','stock','menu','snap'].every(k=>S.ready[k]))return;
  for(let i=1;i<=60;i++){const d=addDays(todayS(),-i);if(S.snap[d])continue;const o={};let any=false;
    MEALS.forEach(m=>{const v=livePlate(d,m[0]);o[m[0]]=v;if(v)any=true});
    if(any){S.snap[d]=o;db.doc('snap/'+d).set(o).catch(()=>{})}}}
function eats(date,uid,k){const a=S.att[date+'_'+uid];return !(a&&a[k]===false)}
function guestsOn(date,k){return Object.values(S.guests).filter(g=>g.date===date&&g[k])}
const guestN=(date,k)=>guestsOn(date,k).reduce((a,g)=>a+num(g.n),0);
function servings(date,k){if(menuFor(date).off[k])return 0;return members().filter(m=>eats(date,m.id,k)).length+guestN(date,k)}
function dayCost(date){return MEALS.reduce((a,m)=>a+plate(date,m[0])*servings(date,m[0]),0)}
function useOn(date,out){const mn=menuFor(date);
  MEALS.forEach(m=>{const k=m[0],sv=servings(date,k);if(!sv)return;
    mn[k].forEach(id=>{const d=S.dishes[id];if(!d)return;(d.ing||[]).forEach(i=>{out[i.s]=(out[i.s]||0)+num(i.q)*sv})})})}
function stockNow(){const today=todayS(),res={};
  Object.keys(S.stock).forEach(id=>{const s=S.stock[id];const a=s.asOf||today;const use={};
    for(let d=a;d<=today;d=addDays(d,1))useOn(d,use);
    let q=num(s.qty);Object.values(S.purch).forEach(p=>{if(p.item===id&&p.date>=a)q+=num(p.qty)});
    res[id]=q-(use[id]||0)});return res}
function need7(start){const use={};for(let i=0;i<7;i++)useOn(addDays(start,i),use);return use}
function monthBill(mo){const today=todayS(),a=mo.split('-').map(Number),days=new Date(a[0],a[1],0).getDate();
  const per={},tot={till:0,est:0},mem=members();
  const row=id=>per[id]||(per[id]={id,meals:0,own:0,guest:0});
  mem.forEach(m=>row(m.id));
  for(let i=1;i<=days;i++){const d=mo+'-'+pad(i);
    MEALS.forEach(m=>{const k=m[0],pc=plate(d,k);if(!pc)return;
      const at=mem.filter(x=>eats(d,x.id,k)),gs=guestsOn(d,k);
      const gn=gs.reduce((s,g)=>s+num(g.n),0),total=pc*(at.length+gn);
      if(d<=today){tot.till+=total;at.forEach(x=>{const r=row(x.id);r.meals++;r.own+=pc});
        gs.forEach(g=>{row(g.by||'?').guest+=pc*num(g.n)})}
      else tot.est+=total})}
  return {per,tot}}
function paidBy(mo){const p={};let all=0;Object.values(S.pay).concat(Object.values(S.exp)).forEach(x=>{if(x.month===mo){p[x.uid]=(p[x.uid]||0)+num(x.amt);all+=num(x.amt)}});return {p,all}}
function pendMonths(){const cur=todayS().slice(0,7),out=[];
  for(let i=1;i<=12;i++){const d=parse(cur+'-01');d.setMonth(d.getMonth()-i);const mo=iso(d).slice(0,7),B=monthBill(mo);if(!B.tot.till)continue;
    const P=paidBy(mo),rows=Object.keys(B.per).map(id=>({id,rem:B.per[id].own+B.per[id].guest-(P.p[id]||0)})).filter(x=>x.rem>0.5);
    if(rows.length)out.push({mo,rows})}
  return out}
function pendCard(){const pm=pendMonths();if(!pm.length)return '<div class="note">Pichle mahine ka koi bill baaki nahi. ✓</div>';
  let h='<section class="card"><h2>Pichle mahine ka baaki</h2>';
  pm.forEach(p=>{const tot=p.rows.reduce((a,r)=>a+r.rem,0);
    h+='<div style="border-top:1px solid var(--line);padding-top:8px"><div class="row between"><b>'+fmtMonth(p.mo)+'</b><b class="num bad">'+rupee(tot)+' baaki</b></div>'+
    p.rows.map(r=>'<div class="row between"><span>'+esc(r.id==='?'?'Unknown':first(nameOf(r.id)))+(r.id===me.id?' (aap)':'')+'</span><span class="num">'+rupee(r.rem)+(r.id===me.id?' <button class="btn sm brand" data-act="payMonth" data-a="'+p.mo+'" data-b="'+Math.ceil(r.rem)+'">Bharo</button>':'')+'</span></div>').join('')+'</div>'});
  return h+'</section>'}
function expForm(mo){const x=UI.xp,l=Object.keys(S.exp).map(id=>({id,...S.exp[id]})).filter(e=>e.uid===me.id&&e.month===mo).sort((a,b)=>(b.ts||0)-(a.ts||0));
  let h='<section class="card"><h3>Bahar se kharida</h3><div class="small mute">Ghar ke liye kuch kharida? Yahan likho. Aapke naam se admin ko dikhega aur aapke hisaab mein jud jayega.</div>'+
  '<div class="fields"><label class="f">Kya kharida<input type="text" id="xp-item" value="'+esc(x.item)+'" data-bind="xp.item" maxlength="60"></label>'+
  '<label class="f">Amount (₹)<input type="number" inputmode="decimal" id="xp-amt" value="'+esc(x.amt)+'" data-bind="xp.amt"></label></div>'+
  '<button class="btn brand" data-act="expAdd"'+(canWrite?'':' disabled')+'>Add karo</button>';
  l.forEach(e=>{h+='<div class="row between" style="border-top:1px solid var(--line);padding-top:8px"><div>'+esc(e.item)+'<div class="small mute">'+esc(e.date)+'</div></div><b class="num">'+rupee(e.amt)+'</b><button class="btn sm" data-act="expDel" data-a="'+esc(e.id)+'">'+(UI.cf==='x'+e.id?'Pakka hatao?':'Hatao')+'</button></div>'});
  if(l.length)h+='<div class="row between"><span class="mute">Is mahine ka kul</span><b class="num">'+rupee(l.reduce((a,e)=>a+num(e.amt),0))+'</b></div>';
  return h+'</section>'}
function admExp(){const l=Object.keys(S.exp).map(id=>({id,...S.exp[id]})).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,30),mo=todayS().slice(0,7);
  let h='<section class="card"><h3>Family members ka kharcha</h3>';
  if(!l.length)h+='<div class="empty">Abhi kisi ne kuch add nahi kiya.</div>';
  l.forEach(e=>{h+='<div class="row between" style="border-top:1px solid var(--line);padding-top:8px"><div><b>'+esc(first(nameOf(e.uid)))+'</b> · '+esc(e.item)+'<div class="small mute">'+esc(e.date)+'</div></div><b class="num">'+rupee(e.amt)+'</b><button class="btn sm" data-act="expDel" data-a="'+esc(e.id)+'">'+(UI.cf==='x'+e.id?'Pakka hatao?':'Hatao')+'</button></div>'});
  h+='<div class="row between"><span class="mute">Is mahine ka kul</span><b class="num">'+rupee(l.filter(e=>e.month===mo).reduce((a,e)=>a+num(e.amt),0))+'</b></div>';
  return h+'</section>'}


/* ---------- writes ---------- */
async function setAtt(date,uid,k,val){const id=date+'_'+uid,c=S.att[id]||{};
  const n={date,uid,b:c.b!==false,l:c.l!==false,s:c.s!==false,d:c.d!==false};n[k]=val;await db.doc('att/'+id).set(n)}
function ask(k){if(UI.cf===k){UI.cf=null;return true}UI.cf=k;draw();return false}

/* ---------- views ---------- */
function dayNav(d){const t=todayS();
  return '<div class="daynav"><button class="btn sm" data-act="day" data-a="-1" aria-label="Pichla din">‹</button>'+
  '<div class="t">'+esc(fmtDate(d))+(d===t?' <span class="pill">Aaj</span>':'')+'</div>'+
  '<button class="btn sm" data-act="day" data-a="1" aria-label="Agla din">›</button></div>'+
  (d!==t?'<div><button class="btn sm ghost" data-act="goDay" data-a="'+t+'">Aaj par jao</button></div>':'')}

function ensureEdit(){if(UI.edit&&UI.edit.date===UI.mdate)return;const m=menuFor(UI.mdate);
  UI.edit={date:UI.mdate,scope:'day',sel:{b:[...m.b],l:[...m.l],s:[...m.s],d:[...m.d]},
    opt:{b:[...m.opt.b],l:[...m.opt.l],s:[...m.opt.s],d:[...m.opt.d]},off:{...m.off},note:m.note}}
function menuEditor(){ensureEdit();const e=UI.edit,d=e.date,dl=Object.keys(S.dishes).sort((a,b)=>S.dishes[a].name.localeCompare(S.dishes[b].name));
  const dow=DAYN[DOW[parse(d).getDay()]];

function viewToday(){const d=UI.date,t=todayS(),past=d<t,mn=menuFor(d),mem=members();
  const mine=me.id&&S.members[me.id]&&!S.members[me.id].off,allOff=MEALS.every(m=>mn.off[m[0]]);
  let h='<section class="card">'+dayNav(d)+
    (isAdmin?'<div><button class="btn sm" data-act="adminMenu">Admin mein menu badlo</button></div>':'')+'</section>';
  if(allOff)h+='<div class="note"><b>Is din ghar mein cooking band hai.</b> Bahar khana hai.'+(mn.note?' '+esc(mn.note):'')+'</div>';
  else if(mn.note)h+='<div class="note">'+esc(mn.note)+'</div>';
  if(!Object.keys(S.dishes).length)h+='<div class="note">'+(isAdmin?'Abhi koi dish nahi hai. Admin tab mein dishes aur stock jodo.':'Admin ne abhi menu set nahi kiya.')+'</div>';
  if(!mine&&me.id===null)h+='<div class="note">Aapki pehchaan nahi mili, isliye aap sirf menu dekh sakte hain.</div>';
  MEALS.forEach(m=>{const k=m[0],ids=mn[k],at=mem.filter(x=>eats(d,x.id,k)),gn=guestN(d,k),pc=plate(d,k);
    if(mn.off[k]){h+='<section class="card"><div class="meal-h"><h3>'+m[1]+'</h3><span class="small mute">'+m[2]+'</span></div><div class="dishes mute">Cooking band · bahar khana hai</div></section>';return}
    const eating=mine?eats(d,me.id,k):null;
    h+='<section class="card"><div class="meal-h"><h3>'+m[1]+'</h3><span class="small mute">'+m[2]+'</span></div>'+
    '<div class="dishes">'+(ids.length?ids.map(i=>esc((S.dishes[i]||{}).name||'?')).join(' · '):'<span class="mute">Menu set nahi hua</span>')+'</div>'+
    '<div class="small mute num">'+(pc?rupee(pc)+' / plate · ':'')+at.length+' log'+(gn?' + '+gn+' guest':'')+(pc?' · '+rupee(pc*(at.length+gn)):'')+'</div>';
    if(mine)h+='<div class="yn"><button class="btn'+(eating?' ok':'')+'" data-act="att" data-a="'+k+'" data-b="1"'+(past?' disabled':'')+'>✓ Khaunga</button>'+
      '<button class="btn'+(eating===false?' no':'')+'" data-act="att" data-a="'+k+'" data-b="0"'+(past?' disabled':'')+'>✕ Cancel</button></div>';
    h+='<div class="chips">'+mem.map(x=>{const on=eats(d,x.id,k),nm=esc(first(nameOf(x.id)));
      return isAdmin&&!past?'<button class="chip '+(on?'on':'off')+'" data-act="admAtt" data-a="'+esc(x.id)+'" data-b="'+k+'">'+nm+'</button>':'<span class="chip '+(on?'on':'off')+'">'+nm+'</span>'}).join('')+'</div></section>'});
  h+='<div class="card row between"><span class="mute">Is din ka kul kharcha</span><span class="big num">'+rupee(dayCost(d))+'</span></div>';
  return h}

function viewWeek(){const t=todayS();let h='<div class="sub">Agle 7 din. Kisi din par tap karke ✓ / ✕ lagao.</div>';

    h+='<button class="card" style="text-align:left;cursor:pointer" data-act="goDay" data-a="'+d+'"><div class="row between"><h3>'+(i===0?'Aaj · ':i===1?'Kal · ':'')+esc(fmtDate(d))+'</h3><span class="small mute num">'+rupee(dayCost(d))+'</span></div>'+
    (mn.note?'<div class="small mute">'+esc(mn.note)+'</div>':'')+'<div class="wk">'+
    MEALS.map(m=>{const k=m[0],c=me.id&&S.members[me.id]&&!eats(d,me.id,k);
      return '<b>'+m[3]+'</b><span>'+(mn.off[k]?'<span class="bad">Cooking band</span>':(mn[k].length?mn[k].map(x=>esc((S.dishes[x]||{}).name||'?')).join(', '):'—')+(c?' <span class="bad">(cancel)</span>':''))+'</span>'}).join('')+'</div></button>'}
  return h}

function viewBill(){const mo=UI.month,B=monthBill(mo),P=paidBy(mo),mem=members();
  const remain=Math.max(0,B.tot.till-P.all),pct=B.tot.till?Math.min(100,P.all/B.tot.till*100):0;
  const my=B.per[me.id]||{own:0,guest:0,meals:0},myShare=my.own+my.guest,myPaid=P.p[me.id]||0,myRem=Math.max(0,myShare-myPaid);

    '<div class="small mute num">Maine diya '+rupee(myPaid)+(myRem>0?' · baaki '+rupee(myRem):' · poora ho gaya')+'</div>'+
    '<div class="row">'+(myRem>0?'<button class="btn brand" data-act="payShare" data-a="'+Math.ceil(myRem)+'">Mera hissa bharo '+rupee(myRem)+'</button>':'')+
    (remain>0?'<button class="btn" data-act="payFull" data-a="'+Math.ceil(remain)+'">Poora bill bharo '+rupee(remain)+'</button>':'')+'</div>'+
    '<div class="row"><div class="grow"><input type="number" inputmode="decimal" min="1" id="payamt" placeholder="Kuch amount (₹)" value="'+esc(UI.payAmt)+'" data-bind="payAmt"></div><button class="btn" data-act="payPart">Contribute</button></div>'+
    '<div class="small mute">Yeh sirf record hai. Paisa app se nahi katta; ghar mein aapas mein do.</div></section>'}
  if(me.id&&S.members[me.id])h+=expForm(mo);
  h+='<section class="card"><h3>Sabka hisaab</h3><div class="table"><table><thead><tr><th>Naam</th><th class="r">Hissa</th><th class="r">Diya</th><th class="r">Hisaab</th></tr></thead><tbody>';
  Object.keys(B.per).forEach(id=>{const r=B.per[id],sh=r.own+r.guest,pd=P.p[id]||0,bal=pd-sh;
    h+='<tr><td>'+esc(id==='?'?'Unknown':first(nameOf(id)))+'</td><td class="r num">'+rupee(sh)+'</td><td class="r num">'+rupee(pd)+'</td><td class="r num '+(bal<-0.5?'bad':'good')+'">'+(bal<-0.5?'baaki '+rupee(-bal):bal>0.5?'extra '+rupee(bal):'barabar')+'</td></tr>'});
  h+='</tbody></table></div></section>';

  pl.forEach(x=>{h+='<div class="row between" style="border-top:1px solid var(--line);padding-top:8px"><div><b class="num">'+rupee(x.amt)+'</b> · '+esc(first(nameOf(x.uid)))+

    ((isAdmin||x.uid===me.id)?'<button class="btn sm" data-act="payDel" data-a="'+esc(x.id)+'">'+(UI.cf==='p'+x.id?'Pakka hatao?':'Hatao')+'</button>':'')+'</div>'});
  h+='</section>';
  const bl=Object.keys(S.bills).map(id=>({id,...S.bills[id]})).filter(x=>(x.date||'').slice(0,7)===mo).sort((a,b)=>b.date.localeCompare(a.date));
  h+='<section class="card"><h3>Sunday ka bill</h3>';

    h+='<div style="border-top:1px solid var(--line);padding-top:8px"><div class="row between"><b>'+esc(fmtDate(x.date))+(x.note?' · '+esc(x.note):'')+'</b><b class="num">'+rupee(x.amt)+'</b></div>'+
    (it.length?'<div class="small mute">'+it.map(p=>{const s=S.stock[p.item]||{name:'?',unit:''};return esc(s.name)+' '+fmtQty(num(p.qty),s.unit)+' ('+rupee(p.amt)+')'}).join(', ')+'</div>':'')+'</div>'});
  h+='</section>';
  return h+'<div class="card row between"><span class="mute">Is mahine ki grocery khareed</span><b class="num">'+rupee(groceryMonth(mo))+'</b></div>'}
function purchOn(date){return Object.keys(S.purch).map(id=>({id,...S.purch[id]})).filter(p=>p.date===date).sort((a,b)=>(a.ts||0)-(b.ts||0))}
function groceryMonth(mo){const dates=new Set();Object.values(S.purch).forEach(p=>{if((p.date||'').slice(0,7)===mo)dates.add(p.date)});
  Object.values(S.bills).forEach(b=>{if((b.date||'').slice(0,7)===mo)dates.add(b.date)});
  let t=0;dates.forEach(d=>{t+=S.bills[d]?num(S.bills[d].amt):purchOn(d).reduce((a,p)=>a+num(p.amt),0)});return t}

  Object.keys(S.stock).forEach(id=>{if(Math.max(0,(nd[id]||0)-st[id])>0.0005)cnt++});
  const stat=(a,b)=>'<div><div class="small mute">'+a+'</div><div class="big num">'+b+'</div></div>';

  return h+({menu:menuEditor,shop:admShop,bill:admBill,dish:admDish,stock:admStock,people:admPeople2}[UI.adm]||menuEditor)()}

    l.err=msg;if(!msg)l.w='';draw()},
  logout(){UI.tab='today';UI.edit=null;auth.signOut()},
  async mAdd(){const n=UI.nm,name=String(n.n).trim(),ph=cleanP(n.p),pw=String(n.w).trim();
    if(!name){toast('Naam likho');return}if(ph.length<10){toast('10 digit ka phone likho');return}if(pw.length<6){toast('Password kam se kam 6 akshar ka rakho');return}
    if(Object.values(S.members).some(m=>cleanP(m.phone)===ph)){toast('Ye number pehle se juda hai');return}
    await w(async()=>{const mid=db.collection('members').doc().id;await setCred(mid,ph,pw);
      await db.doc('members/'+mid).set({name,phone:ph,manual:true,since:todayS()});UI.nm={n:'',p:'',w:''};toast('Member jud gaya');draw()})},
  pwOpen(a){UI.pwId=UI.pwId===a?null:a;UI.pwVal='';UI.pwP=(S.members[a]||{}).phone||'';draw()},
  async pwSave(){const id=UI.pwId,m=S.members[id],ph=cleanP(UI.pwP),pw=String(UI.pwVal).trim();
    if(ph.length<10){toast('10 digit ka phone likho');return}if(pw.length<6){toast('Password kam se kam 6 akshar ka rakho');return}
    if(Object.keys(S.members).some(i=>i!==id&&cleanP(S.members[i].phone)===ph)){toast('Ye number kisi aur ka hai');return}
    await w(async()=>{await setCred(id,ph,pw);await db.doc('members/'+id).set({...m,phone:ph,manual:true});UI.pwId=null;toast('Naya password set ho gaya');draw()})},
  async selfMember(){await w(async()=>{const id=auth.currentUser.uid;await db.doc('members/'+id).set({name:'Admin',phone:ADMIN_PHONE,manual:true,since:todayS()});
    await db.doc('uids/'+id).set({mid:id});me.id=id;toast('Aap member ban gaye');draw()})},
  async memberOff(id){const m=S.members[id];await w(()=>db.doc('members/'+id).set({...m,off:!m.off}))},
  async memberAdd(){const n=String(UI.newMember).trim();if(!n){toast('Naam likho');return}
    await w(async()=>{await db.collection('members').doc().set({name:n,manual:true,since:todayS()});UI.newMember='';draw()})}
};
async function pay(amt,kind,mo){if(!me.id){toast('Aapki pehchaan nahi mili');return}if(amt<=0)return;
  await w(async()=>{await db.collection('pay').add({uid:me.id,month:mo||UI.month,amt:Math.round(amt*100)/100,kind,date:todayS(),ts:Date.now()});toast(rupee(amt)+' jama ho gaye')})}
async function purchase(id,q,a){await w(async()=>{const s=S.stock[id];
  await db.collection('purch').add({item:id,qty:q,amt:a,date:todayS(),ts:Date.now()});
  if(a>0&&q>0){await db.doc('stock/'+id).update({price:Math.round(a/q*100)/100})}
  delete UI.buy[id];toast('Stock mein add ho gaya')})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const a=t.dataset.act;if(!/Del$/.test(a))UI.cf=null;if(ACT[a])ACT[a](t.dataset.a,t.dataset.b,t)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('#payamt'))ACT.payPart()});

/* ---------- boot ---------- */
function sub(q,key){return q.onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S[key]=o;S.ready[key]=true;
  if(key==='members'&&me.id&&o[me.id]&&o[me.id].name)me.name=o[me.id].name;
  if(key==='members'&&!reg&&me.id&&canWrite&&!o[me.id]){reg=true;db.doc('members/'+me.id).set({since:todayS()}).catch(()=>{})}
  schedule()},e=>{S.ready[key]=true;schedule()})}
async function init(){
  draw();if(!FB_OK)return;
  try{firebase.initializeApp(FBC);auth=firebase.auth();db=firebase.firestore()}catch(e){toast('Firebase connect nahi hua');return}
  authBusy=true;draw();
  auth.onAuthStateChanged(async u=>{stopSubs();
    if(!u){role=null;isAdmin=false;me={id:null,name:''};authBusy=false;draw();return}
    isAdmin=(u.email||'').toLowerCase()===ADMIN_PHONE+'@panda.app';role=isAdmin?'admin':'family';
    let mid=u.uid;
    try{const sn=await db.doc('uids/'+u.uid).get();if(sn.exists)mid=sn.data().mid;else if(!isAdmin)throw 0;
      if(!isAdmin)await db.doc('members/'+mid).get()}
    catch(e){toast('Aapka access band hai. Admin se baat karo.');await auth.signOut();return}
    me={id:mid,name:isAdmin?'Admin':''};startSubs();authBusy=false;draw()})}
init();
})();
</script>
